name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta todos los miércoles y domingos a las 00:00 UTC
    - cron: '0 0 * * 0,3'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer Ping a la API de Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
          -H "apikey: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
          "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/"
